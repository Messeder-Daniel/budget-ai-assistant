spring:
  application:
    name: budget-ai-assistant
  datasource:
    url: jdbc:h2:mem:budgetdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-configured}
      chat:
        options:
          model: gpt-4o-mini

openai:
  api-key: ${OPENAI_API_KEY:not-configured}
  base-url: https://api.openai.com

server:
  error:
    include-message: always
